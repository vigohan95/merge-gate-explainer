permissions:
  scopes:
    - storage:app
  external:
    fetch:
      backend:
        - address: "*.hello.atlassian-dev.net"
modules:
  rovo:agent:
    - key: merge-gate-explainer
      name: Merge Gate Explainer
      description: Explains why Merge Policy Gate held a Bitbucket pull request, what
        each rule means, and how to unblock it; reads live verdicts from the
        gate.
      prompt: resource:agent-resources;prompts/merge-gate-explainer.md
      conversationStarters:
        - Why is pull request 2 in hanvigo-dev/gate-demo held?
        - What does rule 2.1 mean?
        - Give me a starter MERGE-POLICY.md for my repository.
      actions:
        - connect-gate
        - explain-pull-request
        - stored-verdict
        - explain-rule
        - policy-template
  action:
    - key: connect-gate
      name: Connect this site to a Merge Policy Gate installation
      function: fn-connect-gate
      actionVerb: UPDATE
      description: Save the verdict feed URL of the Merge Policy Gate app installed on
        a Bitbucket workspace. Use when the user gives a URL that starts with
        https and contains hello.atlassian-dev.net.
      inputs:
        feedUrl:
          title: Verdict feed URL
          type: string
          required: true
          description: The web trigger URL printed by forge webtrigger for the
            merge-policy-gate app
    - key: explain-pull-request
      name: Evaluate a pull request now and explain the verdict
      function: fn-explain-pr
      actionVerb: GET
      description: Ask the connected Merge Policy Gate to evaluate a Bitbucket pull
        request right now. Use when the user asks why a pull request is held,
        whether it may merge, or what the gate says.
      inputs:
        workspace:
          title: Workspace
          type: string
          required: true
          description: The Bitbucket workspace slug, for example hanvigo-dev
        repository:
          title: Repository
          type: string
          required: true
          description: The repository slug, for example gate-demo
        pullRequestId:
          title: Pull request number
          type: integer
          required: true
          description: The pull request id shown in Bitbucket
    - key: stored-verdict
      name: Get the verdict the merge check stored last time
      function: fn-stored-verdict
      actionVerb: GET
      description: Return the verdict the merge check stored for a pull request at its
        last run, without re-evaluating. Use when the user asks what the gate
        decided last time.
      inputs:
        workspace:
          title: Workspace
          type: string
          required: true
          description: The Bitbucket workspace slug
        repository:
          title: Repository
          type: string
          required: true
          description: The repository slug
        pullRequestId:
          title: Pull request number
          type: integer
          required: true
          description: The pull request id
    - key: explain-rule
      name: Explain a merge policy rule
      function: fn-explain-rule
      actionVerb: GET
      description: Explain what a Merge Policy Gate rule (for example 2.1, 3.4, 4.1)
        means and how to satisfy it. Use when the user asks about a rule number
        cited in a verdict.
      inputs:
        ruleId:
          title: Rule id
          type: string
          required: true
          description: The rule number, for example 2.1 or §3.4
    - key: policy-template
      name: Get the starter MERGE-POLICY.md
      function: fn-policy-template
      actionVerb: GET
      description: Return the starter MERGE-POLICY.md file and its default values so a
        repository can opt in. Use when the user asks how to set up or configure
        the gate.
      inputs:
        format:
          title: Format
          type: string
          required: false
          description: Optional, markdown (default) or json
  function:
    - key: fn-connect-gate
      handler: index.connectGate
    - key: fn-explain-pr
      handler: index.explainPullRequest
    - key: fn-stored-verdict
      handler: index.storedVerdict
    - key: fn-explain-rule
      handler: index.explainRule
    - key: fn-policy-template
      handler: index.policyTemplate
resources:
  - key: agent-resources
    path: resources
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/3bf737b7-2d6f-4c7e-a8d5-93a66aef739c
